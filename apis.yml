name: Swell Energy
description: 'Swell Energy is a residential clean-energy company that designs, finances, installs, and
  operates home solar, battery storage, and virtual power plant (VPP) systems for homeowners, businesses,
  and utilities. Its Swell Compass platform connects to home energy devices to monitor, report, and optimize
  energy use, and coordinates aggregated distributed batteries into grid services (GridRevenue programs)
  in partnership with utilities. Backed by SoftBank Vision Fund, the company operates a consumer web and
  mobile experience (Compass) rather than a public developer API; no developer portal, OpenAPI, SDKs, or
  documented public API surface was found during enrichment.'
